version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: monthly
    # The fuzz package reaches the rest of the tree through a path dependency,
    # so anything but its own direct dependency is already covered by the root
    # entry above -- and an update opened from here edits the workspace
    # manifest while regenerating only fuzz/Cargo.lock, which leaves the two
    # lockfiles disagreeing.
    allow:
      - dependency-name: libfuzzer-sys
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      # The MSRV job pins this action to the Rust version it tests, not to an
      # action release. A bump here would silently raise the supported floor.
      - dependency-name: dtolnay/rust-toolchain
