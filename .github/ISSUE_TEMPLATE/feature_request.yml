name: 💡 Feature request
description: Suggest a capability or an API change
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please check [ROADMAP.md](../blob/main/docs/ROADMAP.md) first — some
        things are planned, and some are deliberately out of scope.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that Vaulted makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Sketch the API or behavior you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This does not require Vaulted to implement its own cryptographic primitive
          required: true
        - label: I have read the relevant document in `docs/`
