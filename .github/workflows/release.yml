name: Release

# Tagging is the trigger: `git tag v0.1.0 && git push origin v0.1.0` publishes
# every crate to crates.io and opens a GitHub release with prebuilt binaries.
# Nothing here runs off a branch push, so a merge to main can never publish.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

# A second tag pushed while the first is still publishing would race for the
# same release; queue them instead.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: verify the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A tag that disagrees with Cargo.toml would publish a version nobody can
      # find from the repository, and the tag cannot be moved once crates.io has
      # the version. Catch it before anything is uploaded.
      - name: tag matches the workspace version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "vaulted-core") | .version')
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag $GITHUB_REF_NAME says $tag, Cargo.toml says $manifest"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      # The same packaging and verification build crates.io will run, so a
      # missing file or an unpublishable dependency fails here rather than
      # halfway through publishing the five crates.
      - run: cargo package --workspace

  publish:
    name: publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # --workspace resolves the publish order itself (crypto and derive before
      # core, core before cli and postgres) and waits for each crate to appear
      # in the index before the next one needs it. The two `publish = false`
      # members, vaulted-tests and vaulted-examples, are skipped.
      #
      # Once these crates exist on crates.io, this token can be replaced with
      # trusted publishing (rust-lang/crates-io-auth-action, `id-token: write`),
      # which needs no long-lived secret. It cannot be configured for a crate
      # that has never been published, which is why the first release uses one.
      - run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  binaries:
    name: ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # Every target here has a native runner, so this is a plain build rather
      # than a cross-compile.
      - run: cargo build --release --locked -p vaulted-cli --target ${{ matrix.target }}
      - name: package the binary
        run: |
          name="vaulted-${{ needs.verify.outputs.version }}-${{ matrix.target }}"
          mkdir "$name"
          cp target/${{ matrix.target }}/release/vaulted "$name/"
          cp README.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            *.tar.gz
            *.tar.gz.sha256

  release:
    name: publish the GitHub release
    needs: [verify, publish, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      # Draft releases are for review; this one is only reached after the crates
      # are already on crates.io, so there is nothing left to hold back.
      - name: create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            artifacts/*
