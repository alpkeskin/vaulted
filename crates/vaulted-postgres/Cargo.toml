[package]
name = "vaulted-postgres"
description = "PostgreSQL glue for Vaulted: ToSql/FromSql for encrypted values, and DDL for their columns"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

# Feature-gated items are part of the public API, so docs.rs has to build with
# all of them or half the surface is invisible there.
[package.metadata.docs.rs]
all-features = true

[features]
default = ["derive", "postgres-types"]
# Re-exports #[derive(Vaulted)], so a dependent needs only this crate.
derive = ["vaulted-core/derive"]
# The driver glue, which the orphan rule keeps in the core. Pick the one your
# application already uses; the DDL this crate generates is the same either way,
# and enabling both is supported.
postgres-types = ["vaulted-core/postgres"]
# Named by sqlx version: an impl written against one is invisible to the other,
# so the choice has to be explicit. Both may be on at once.
sqlx-0_8 = ["vaulted-core/sqlx-0_8"]
sqlx-0_9 = ["vaulted-core/sqlx-0_9"]

[dependencies]
vaulted-core.workspace = true

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
