[package]
name = "vaulted-crypto"
description = "Cryptographic primitives for Vaulted: AEAD, HMAC, HKDF and secure randomness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

# Feature-gated items are part of the public API, so docs.rs has to build with
# all of them or half the surface is invisible there.
[package.metadata.docs.rs]
all-features = true

[features]
default = ["xchacha"]
# XChaCha20-Poly1305, an optional alternative AEAD. AES-256-GCM is not optional:
# it is the baseline algorithm of the v1 format, and a build that cannot read
# values written with it could not read a typical database at all.
xchacha = ["dep:chacha20poly1305"]

[dependencies]
aes-gcm.workspace = true
chacha20poly1305 = { workspace = true, optional = true }
hmac.workspace = true
sha2.workspace = true
hkdf.workspace = true
subtle.workspace = true
zeroize.workspace = true
getrandom.workspace = true
thiserror.workspace = true

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
