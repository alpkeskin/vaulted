[package]
name = "vaulted-core"
description = "Field-level encryption for databases: versioned ciphertext, blind indexes, key rotation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

# Feature-gated items are part of the public API, so docs.rs has to build with
# all of them or half the surface is invisible there.
[package.metadata.docs.rs]
all-features = true

[features]
default = ["xchacha", "local-provider"]
# Optional XChaCha20-Poly1305 support (ciphertext format v2 algorithm slot).
xchacha = ["vaulted-crypto/xchacha"]
# `#[derive(Vaulted)]`, re-exported from vaulted-derive.
derive = ["dep:vaulted-derive"]
# `ToSql`/`FromSql` for EncryptedValue and BlindIndex. The orphan rule puts them
# here; the dependency is on the trait crate only, never a driver or a runtime.
postgres = ["dep:postgres-types", "dep:bytes"]
# `sqlx::Type`/`Encode`/`Decode` for the same types. Named by sqlx version
# because the impls only apply to the exact one they were compiled against;
# enabling both is supported and gives two independent sets.
sqlx-0_8 = ["dep:sqlx-0_8"]
sqlx-0_9 = ["dep:sqlx-0_9"]
# `serde` impls for EncryptedValue and BlindIndex (serialized as strings).
serde = ["dep:serde"]
# In-process keyring plus JSON keyfile loading, for development and the CLI.
local-provider = ["serde", "dep:serde_json", "dep:zeroize"]

[dependencies]
# Inherited with default-features = false (see the workspace manifest), so this
# crate's own `xchacha` feature decides whether XChaCha20-Poly1305 is compiled
# in. AES-256-GCM always is.
vaulted-crypto.workspace = true
vaulted-derive = { workspace = true, optional = true }
base64.workspace = true
thiserror.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
postgres-types = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
sqlx-0_8 = { workspace = true, optional = true }
sqlx-0_9 = { workspace = true, optional = true }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[lib]
# The library has no #[bench] targets; disabling the default harness keeps
# `cargo bench` from trying to parse criterion's arguments with it.
bench = false

[[bench]]
name = "vault"
harness = false

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
