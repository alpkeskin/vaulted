[package]
name = "vaulted-derive"
description = "#[derive(Vaulted)] for vaulted-core: declare a struct's encrypted fields once"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
proc-macro = true

# syn and quote are build-time only: they compile into the macro, never into a
# dependent's binary, so the core's short dependency list is unaffected.
[dependencies]
syn.workspace = true
quote.workspace = true
proc-macro2.workspace = true

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
